  /* ---------- 2. 中国航司 ---------- */
  const AIRLINES = {

  /* ---------- 3. 时段 ---------- */
  const TIME_RANGES = {
    early:     [6, 7, 8],
    morning:   [9, 10, 11],
    afternoon: [12, 13, 14, 15, 16],
    evening:   [17, 18, 19, 20],
    night:     [21, 22, 23, 0, 1, 2, 3, 4, 5]
  };

  const TIME_BASE_DELAY = { early: 0.06, morning: 0.10, afternoon: 0.14, evening: 0.20, night: 0.16 };
  const TIME_ONTIME_HINT = { early: '正常率 ≈ 94%', morning: '正常率 ≈ 91%', afternoon: '正常率 ≈ 88%', evening: '正常率 ≈ 85%', night: '正常率 ≈ 87%' };
  const TIME_BUSY = { early: 0.15, morning: 0.45, afternoon: 0.70, evening: 0.65, night: 0.20 };

  const CACHE_KEY = 'flight_delay_cn_v4';
  const CACHE_TTL = 3 * 60 * 60 * 1000;
  const BATCH_SIZE = 20;

  /* ---------- 4. 工具 ---------- */
  const $ = id => document.getElementById(id);
  const pad2 = n => String(n).padStart(2, '0');
  function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    return Math.floor(s / 3600) + ' 小时前';
  }

  /* ---------- 5. WMO 天气代码 ---------- */
  function wmoInfo(code) {
    if (code === 0) return { cat: 'clear',   label: '晴朗',     icon: '☀️' };
    if (code === 1) return { cat: 'clear',   label: '大部晴朗', icon: '🌤️' };
    if (code === 2) return { cat: 'cloudy',  label: '局部多云', icon: '⛅' };
    if (code === 3) return { cat: 'cloudy',  label: '阴天',     icon: '☁️' };
    if (code === 45 || code === 48) return { cat: 'fog', label: '雾', icon: '🌫️' };
    if (code >= 51 && code <= 57) return { cat: 'rain', label: '毛毛雨', icon: '🌦️' };
    if (code >= 61 && code <= 67) return { cat: 'rain', label: '降雨',   icon: '🌧️' };
    if (code >= 71 && code <= 77) return { cat: 'snow', label: '降雪',   icon: '❄️' };
    if (code >= 80 && code <= 82) return { cat: 'rain', label: '阵雨',   icon: '🌧️' };
    if (code === 85 || code === 86) return { cat: 'snow', label: '阵雪', icon: '🌨️' };
    if (code >= 95) return { cat: 'storm', label: '雷暴', icon: '⛈️' };
    return { cat: 'cloudy', label: '多云', icon: '🌥️' };
  }

  /* ---------- 6. 天气抓取（分批） ---------- */
  const WEATHER_VARS = [
    'weather_code', 'temperature_2m', 'dewpoint_2m', 'precipitation',
    'snowfall', 'visibility', 'cloud_cover_low',
    'wind_speed_10m', 'wind_gusts_10m', 'wind_direction_10m',
    'cape', 'pressure_msl'
  ];

  function getTargetHours(dateStr, timeKey) {
    const hours = TIME_RANGES[timeKey];
    const out = [];
    hours.forEach(h => {
      if (timeKey === 'night' && h < 6) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d));
        dt.setUTCDate(dt.getUTCDate() + 1);
        const nd = `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
        out.push(`${nd}T${pad2(h)}`);
      } else {
        out.push(`${dateStr}T${pad2(h)}`);
      }
    });
    return out;
  }

  function aggregateHours(raw, dateStr, timeKey) {
    if (!raw || !raw.hourly || !raw.hourly.time) return null;
    const targets = new Set(getTargetHours(dateStr, timeKey));
    const H = raw.hourly;

    let count = 0;
    let precipMax = 0, snowMax = 0, windMax = 0, gustMax = 0, capeMax = 0;
    let visMin = Infinity, tempSum = 0, lowCloudAvg = 0, codeWorst = 0, sevWorst = -1;

    for (let i = 0; i < H.time.length; i++) {
      if (!targets.has(H.time[i].slice(0, 13))) continue;
      count++;
      const precip = (H.precipitation && H.precipitation[i]) || 0;
      const snow = (H.snowfall && H.snowfall[i]) || 0;
      const wind = (H.wind_speed_10m && H.wind_speed_10m[i]) || 0;
      const gust = (H.wind_gusts_10m && H.wind_gusts_10m[i]) || 0;
      const cape = (H.cape && H.cape[i]) || 0;
      const vis = H.visibility && H.visibility[i];
      const temp = (H.temperature_2m && H.temperature_2m[i]) || 0;
      const lowCloud = (H.cloud_cover_low && H.cloud_cover_low[i]) || 0;
      const code = (H.weather_code && H.weather_code[i]) || 0;

      precipMax = Math.max(precipMax, precip);
      snowMax = Math.max(snowMax, snow);
      windMax = Math.max(windMax, wind);
      gustMax = Math.max(gustMax, gust);
      capeMax = Math.max(capeMax, cape);
      if (vis != null && vis < visMin) visMin = vis;
      tempSum += temp;
      lowCloudAvg += lowCloud;

      const sev = wmoSeverityEstimate(code);
      if (sev > sevWorst) { sevWorst = sev; codeWorst = code; }
    }
    if (count === 0) return null;

    const info = wmoInfo(codeWorst);
    return {
      code: codeWorst, cat: info.cat, label: info.label, icon: info.icon,
      vis: visMin === Infinity ? 99999 : visMin,
      precip: Math.round(precipMax * 10) / 10,
      snow: Math.round(snowMax * 10) / 10,
      wind: Math.round(windMax), gust: Math.round(gustMax), cape: Math.round(capeMax),
      temp: Math.round(tempSum / count),
      lowCloud: Math.round(lowCloudAvg / count), hours: count
    };
  }

  function wmoSeverityEstimate(code) {
    if (code === 0) return 0;
    if (code === 1) return 0.02;
    if (code === 2) return 0.04;
    if (code === 3) return 0.09;
    if (code === 45 || code === 48) return 0.50;
    if (code >= 51 && code <= 57) return 0.22;
    if (code >= 61 && code <= 67) return 0.40;
    if (code >= 71 && code <= 77) return 0.62;
    if (code >= 80 && code <= 82) return 0.44;
    if (code === 85 || code === 86) return 0.66;
    if (code >= 95) return 0.82;
    return 0.10;
  }

  // 分批请求天气
  async function fetchAllAirports() {
    const entries = Object.entries(AIRPORTS);
    const batches = [];
    for (let i = 0; i < entries.length; i += BATCH_SIZE) {
      batches.push(entries.slice(i, i + BATCH_SIZE));
    }

    const allResults = {};
    let okCount = 0;

    for (const batch of batches) {
      const lats = batch.map(([, ap]) => ap.lat).join(',');
      const lons = batch.map(([, ap]) => ap.lon).join(',');
      const url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lats + '&longitude=' + lons
        + '&hourly=' + WEATHER_VARS.join(',')
        + '&timezone=auto&forecast_days=3';

      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const arr = Array.isArray(data) ? data : [data];
        batch.forEach(([code], idx) => {
          if (arr[idx]) { allResults[code] = arr[idx]; okCount++; }
        });
      } catch (err) {
        console.warn('[weather] 批次失败:', err.message);
      }
    }

    return { data: allResults, okCount, total: entries.length };
  }

  function buildWeatherIndex(rawByAirport, dates) {
    const index = {};
    dates.forEach(d => { index[d] = {}; });
    Object.keys(AIRPORTS).forEach(code => {
      const raw = rawByAirport[code];
      dates.forEach(d => {
        index[d][code] = {};
        Object.keys(TIME_RANGES).forEach(tk => {
          index[d][code][tk] = raw ? aggregateHours(raw, d, tk) : null;
        });
      });
    });
    return index;
  }

  function buildFallbackIndex(dates) {
    const index = {};
    dates.forEach(d => {
      index[d] = {};
      Object.keys(AIRPORTS).forEach(code => {
        index[d][code] = {};
        Object.keys(TIME_RANGES).forEach(tk => {
          let h = 0;
          const seed = code + d + tk;
          for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
          const r = (h % 100) / 100;
          const info = r < 0.55
            ? { cat: 'clear', label: '晴朗', icon: '☀️', code: 0 }
            : r < 0.78
              ? { cat: 'cloudy', label: '多云', icon: '⛅', code: 2 }
              : r < 0.92
                ? { cat: 'rain', label: '小雨', icon: '🌧️', code: 61 }
                : { cat: 'storm', label: '雷暴', icon: '⛈️', code: 95 };
          index[d][code][tk] = {
            code: info.code, cat: info.cat, label: info.label, icon: info.icon,
            vis: info.cat === 'storm' ? 2000 : info.cat === 'rain' ? 6000 : 99999,
            precip: info.cat === 'storm' ? 8 : info.cat === 'rain' ? 1.5 : 0,
            snow: 0, wind: 12, gust: 22, cape: info.cat === 'storm' ? 1500 : 200,
            temp: 20, lowCloud: 30, hours: 0, estimated: true
          };
        });
      });
    });
    return index;
  }

  /* ---------- 7. 缓存 ---------- */
  let weatherCache = null;
  let syncing = false;

  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !obj.index || !obj.cachedOn) return null;
      return obj;
    } catch { return null; }
  }
  function saveCache(obj) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(obj)); }
    catch (e) { console.warn('[cache]', e); }
  }
  function setSyncStatus(cls, html) {
    const el = $('syncStatus');
    el.className = cls; el.innerHTML = html;
  }

  /* ---------- 8. 同步 ---------- */
  async function syncWeather(force) {
    if (syncing) return;
    syncing = true; $('refreshBtn').disabled = true;

    const today = new Date();
    const dates = [fmtDate(today), fmtDate(addDays(today, 1))];
    const cached = loadCache();
    const cacheFresh = cached && cached.cachedOn === dates[0]
      && (Date.now() - cached.updatedAt) < CACHE_TTL;

    if (!force && cacheFresh) {
      weatherCache = cached;
      setSyncStatus('ok', '✅ 已加载今日天气 · ' + timeAgo(cached.updatedAt) + '更新');
      finishSync(); return;
    }

    setSyncStatus('loading', '<span class="spin">🔄</span> 正在同步 ' + Object.keys(AIRPORTS).length + ' 个机场天气…');

    try {
      const { data, okCount, total } = await fetchAllAirports();
      if (okCount === 0) throw new Error('所有机场天气获取失败');
      const index = buildWeatherIndex(data, dates);
      weatherCache = { cachedOn: dates[0], updatedAt: Date.now(), index, live: true, okCount, total };
      saveCache(weatherCache);
      const now = new Date();
      setSyncStatus('ok', '✅ 实时天气已更新 · ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes())
        + ' · ' + okCount + '/' + total + ' 机场');
    } catch (err) {
      console.warn('[sync] 联网失败:', err);
      if (cached) {
        weatherCache = cached;
        setSyncStatus('warn', '⚠️ 网络异常 · 使用 ' + timeAgo(cached.updatedAt) + ' 的缓存');
      } else {
        weatherCache = { cachedOn: dates[0], updatedAt: Date.now(), index: buildFallbackIndex(dates), live: false };
        setSyncStatus('warn', '⚠️ 离线估算模式 · 无法连接气象服务');
      }
    }
    finishSync();
  }

  function finishSync() {
    syncing = false; $('refreshBtn').disabled = false;
    $('predictBtn').disabled = false;
    renderWeatherStrip(); runPrediction();
  }

  /* ---------- 9. 选择 ---------- */
  function getSelection() {
    const dateSel = $('dateSelect').value;
    const d = new Date();
    if (dateSel === 'tomorrow') d.setDate(d.getDate() + 1);
    return {
      airline: $('airlineSelect').value,
      origin: $('originSelect').value,
      dest: $('destSelect').value,
      date: fmtDate(d), time: $('timeSelect').value
    };
  }
  function getWeatherFor(code, date, time) {
    if (!weatherCache || !weatherCache.index) return null;
    const day = weatherCache.index[date];
    if (!day || !day[code]) return null;
    return day[code][time] || null;
  }

  /* ---------- 10. 天气条 ---------- */
  function renderWeatherStrip() {
    const sel = getSelection();
    const o = getWeatherFor(sel.origin, sel.date, sel.time);
    const d = getWeatherFor(sel.dest, sel.date, sel.time);
    const dateLabel = sel.date === fmtDate(new Date()) ? '今天' : '明天';
    const timeLabel = { early:'清晨', morning:'上午', afternoon:'下午', evening:'傍晚', night:'夜间' }[sel.time];
    $('wxOrigin').innerHTML = o ? wxBoxHTML(sel.origin, o, dateLabel, timeLabel) : emptyWxBox('出发地', sel.origin);
    $('wxDest').innerHTML   = d ? wxBoxHTML(sel.dest, d, dateLabel, timeLabel)   : emptyWxBox('到达地', sel.dest);
  }

  function wxBoxHTML(code, wx, dateLabel, timeLabel) {
    const ap = AIRPORTS[code];
    const extra = [];
    if (wx.temp != null) extra.push(wx.temp + '°C');
    if (wx.vis < 99999) extra.push('能见 ' + (wx.vis >= 1000 ? (wx.vis / 1000).toFixed(1) + 'km' : wx.vis + 'm'));
    if (wx.gust) extra.push('阵风 ' + wx.gust + 'km/h');
    if (wx.precip) extra.push('降水 ' + wx.precip + 'mm');
    if (wx.snow) extra.push('雪 ' + wx.snow + 'cm');
    return '<span class="wx-icon">' + wx.icon + '</span>'
      + '<span class="wx-meta">'
      +   '<span class="ap">' + code + ' · ' + (ap ? ap.city : '') + '</span>'
      +   '<span class="desc">' + wx.label + (wx.estimated ? ' (估算)' : '') + '</span>'
      +   '<span class="extra">' + dateLabel + timeLabel + ' · ' + extra.join(' · ') + '</span>'
      + '</span>';
  }

  function emptyWxBox(label, code) {
    const ap = AIRPORTS[code];
    return '<span class="wx-icon">🛰️</span>'
      + '<span class="wx-meta">'
      +   '<span class="ap">' + code + ' · ' + (ap ? ap.city : '') + '</span>'
      +   '<span class="desc">' + label + '数据缺失</span>'
      +   '<span class="extra">等待同步…</span>'
      + '</span>';
  }

  /* ---------- 11. 天气影响 ---------- */
  function weatherImpact(wx) {
    if (!wx) return { score: 0.12, reasons: [{ text: '天气数据缺失', weight: 0.12 }] };
    const reasons = [];
    let score = 0;
    const add = (cond, w, text) => { if (cond) { score += w; reasons.push({ text, weight: w }); } };

    add(wx.vis < 500,         0.75, `极低能见度 ${wx.vis}m（CAT III）`);
    add(wx.vis >= 500 && wx.vis < 1600,  0.45, `低能见度 ${wx.vis}m（CAT I/II）`);
    add(wx.vis >= 1600 && wx.vis < 4800, 0.20, `能见度 ${wx.vis}m（受限）`);

    add(wx.precip > 7.5,  0.40, `强降水 ${wx.precip}mm/h`);
    add(wx.precip > 2.5 && wx.precip <= 7.5, 0.22, `中等降水 ${wx.precip}mm/h`);
    add(wx.precip > 0.2 && wx.precip <= 2.5, 0.08, `小量降水`);

    add(wx.snow > 5,   0.85, `强降雪 ${wx.snow}cm（除冰除雪）`);
    add(wx.snow > 1 && wx.snow <= 5,  0.50, `降雪 ${wx.snow}cm（需除冰）`);
    add(wx.snow > 0.1 && wx.snow <= 1, 0.20, `飘雪`);

    add(wx.cape > 2500,  0.70, `强对流 CAPE ${wx.cape} J/kg`);
    add(wx.cape > 1200 && wx.cape <= 2500, 0.35, `对流活跃 CAPE ${wx.cape} J/kg`);

    add(wx.gust > 45,  0.70, `强阵风 ${wx.gust}km/h`);
    add(wx.gust > 35 && wx.gust <= 45, 0.35, `阵风 ${wx.gust}km/h`);
    add(wx.gust > 25 && wx.gust <= 35, 0.12, `中等阵风`);

    const freezing = [48, 56, 57, 66, 67].includes(wx.code);
    add(freezing, 0.55, '冻雾/冻雨（需除冰）');

    add(wx.temp < -8, 0.25, `极寒 ${wx.temp}°C`);

    score = Math.min(1.2, score);
    return { score, reasons };
  }

  /* ---------- 12. 尾号传导 ---------- */
  function upstreamContamination(originCode, date, timeKey) {
    if (!weatherCache || !weatherCache.index[date]) return 0;
    const dayWx = weatherCache.index[date][originCode];
    if (!dayWx) return 0;
    const order = ['early', 'morning', 'afternoon', 'evening', 'night'];
    const idx = order.indexOf(timeKey);
    if (idx <= 0) return 0;
    let cum = 0;
    for (let i = 0; i < idx; i++) {
      const wx = dayWx[order[i]];
      if (!wx) continue;
      const imp = weatherImpact(wx).score;
      const decay = Math.pow(0.78, idx - i);
      cum += imp * decay;
    }
    return Math.min(0.50, cum * 0.18);
  }
/* ---------- 13. 季节/星期 ---------- */
  function seasonalFactor(dateStr) {
    const month = new Date(dateStr + 'T12:00:00').getMonth();
    if (month >= 5 && month <= 7) return 0.14;
    if (month === 11 || month <= 1) return 0.10;
    return -0.02;
  }
  function dowFactor(dateStr) {
    const dow = new Date(dateStr + 'T12:00:00').getDay();
    if (dow === 5) return 0.04;
    if (dow === 0 || dow === 1) return 0.03;
    return 0;
  }

  /* ---------- 14. 拥堵 ---------- */
  function deriveCongestion(originWeatherScore, timeKey, airportCode) {
    const busy = TIME_BUSY[timeKey] || 0.4;
    const sens = (AIRPORTS[airportCode] && AIRPORTS[airportCode].sens) || 1.0;
    const raw = (busy * 0.55 + Math.min(1, originWeatherScore) * 0.55) * sens;
    return Math.min(1, Math.max(0, raw));
  }

  /* ---------- 15. 核心预测 ---------- */
  function computePrediction(sel) {
    const originWx = getWeatherFor(sel.origin, sel.date, sel.time);
    const destWx   = getWeatherFor(sel.dest,   sel.date, sel.time);
    const originImpact = weatherImpact(originWx);
    const destImpact   = weatherImpact(destWx);
    const upstream   = upstreamContamination(sel.origin, sel.date, sel.time);
    const hourDelay  = TIME_BASE_DELAY[sel.time] || 0.12;
    const congestion = deriveCongestion(originImpact.score, sel.time, sel.origin);
    const airlineBase = AIRLINES[sel.airline].base;
    const seasonal = seasonalFactor(sel.date) + dowFactor(sel.date);
    const routeInteraction = Math.min(0.18, originImpact.score * destImpact.score * 0.35);

    let raw = 0.18;
    raw += originImpact.score * 0.50;
    raw += destImpact.score * 0.25;
    raw += routeInteraction;
    raw += hourDelay * 0.60;
    raw += upstream * 0.35;
    raw += congestion * 0.28;
    raw += (airlineBase - 0.055) * 0.45;
    raw += seasonal * 0.45;

    if (originImpact.score > 0.85 && congestion > 0.75) raw += 0.05;

    const sig = 1 / (1 + Math.exp(-2.4 * (raw - 0.72)));
    const prob = Math.round(Math.max(0.03, Math.min(0.92, 0.02 + 0.90 * sig)) * 100);

    return {
      prob, originImpact, destImpact, upstream, congestion,
      hourDelay, airlineBase, seasonal, routeInteraction, originWx, destWx
    };
  }

  /* ---------- 16. 渲染结果 ---------- */
  function runPrediction() {
    const sel = getSelection();
    const r = computePrediction(sel);
    const prob = r.prob;

    $('probValue').innerHTML = prob + '<small>%</small>';
    const fill = $('progressFill');
    fill.style.width = prob + '%';

    let riskText, riskColor, recHtml;
    if (prob < 8) {
      riskText = '极低风险'; riskColor = '#1f7a4a';
      recHtml = '<i>🟢</i> <span>准点率很高，可放心按原计划出行。建议提前 1 小时到达机场。</span>';
    } else if (prob < 18) {
      riskText = '低风险'; riskColor = '#2e7d5e';
      recHtml = '<i>🟢</i> <span>延误概率较低，天气与运行条件良好。仍建议起飞前 2 小时确认航班动态。</span>';
    } else if (prob < 35) {
      riskText = '中等风险'; riskColor = '#b57c1c';
      recHtml = '<i>🟡</i> <span>存在一定延误可能。建议预留 30 分钟缓冲，出发前 3 小时查看航司通知。</span>';
    } else if (prob < 55) {
      riskText = '较高风险'; riskColor = '#d4751a';
      recHtml = '<i>🟠</i> <span>延误概率较高。建议提前联系航司确认状态，考虑购买旅行延误险。</span>';
    } else if (prob < 75) {
      riskText = '高风险'; riskColor = '#b33b2c';
      recHtml = '<i>🔴</i> <span>很可能延误。建议改签早班机或考虑其他交通方式，实时关注航司公告。</span>';
    } else {
      riskText = '极高风险'; riskColor = '#8b1e10';
      recHtml = '<i>🔴</i> <span>大概率延误或取消。强烈建议调整行程，准备住宿/改签方案。</span>';
    }

    if (r.originWx && r.originWx.estimated) {
      recHtml += '<br><span style="font-size:.76rem;opacity:.75;">⚠️ 当前为离线估算模式，建议联网后重新预测。</span>';
    }

    const badge = $('riskBadge');
    badge.textContent = riskText;
    badge.style.backgroundColor = riskColor + '22';
    badge.style.color = riskColor;

    if (prob < 18) fill.style.background = 'linear-gradient(90deg, #6ec48b, #2f9e6c)';
    else if (prob < 45) fill.style.background = 'linear-gradient(90deg, #f0c45a, #d68d2c)';
    else fill.style.background = 'linear-gradient(90deg, #e07b5a, #b33b2c)';

    $('probValue').style.color = prob >= 45 ? '#b33b2c' : (prob >= 18 ? '#b57c1c' : '#0b2b4b');
    $('recommendation').innerHTML = recHtml;
    renderFactors(r, sel);

    const details = [];
    details.push('🛫 ' + sel.origin + ' 天气：' + (r.originWx ? r.originWx.label : '未知'));
    details.push('🛬 ' + sel.dest + ' 天气：' + (r.destWx ? r.destWx.label : '未知'));
    details.push('📈 时段基线：' + Math.round(r.hourDelay * 100) + '%');
    details.push('🔗 尾号传导：' + Math.round(r.upstream * 100) + '%');
    details.push('🚦 拥堵指数：' + Math.round(r.congestion * 100) + '%');
    details.push('✈️ 航司正常率：' + Math.round((1 - r.airlineBase) * 100) + '%');
    if (r.originWx && r.originWx.vis < 99999) {
      details.push('👁️ 能见度：' + (r.originWx.vis >= 1000 ? (r.originWx.vis / 1000).toFixed(1) + 'km' : r.originWx.vis + 'm'));
    }
    if (r.originWx && r.originWx.gust) details.push('💨 阵风：' + r.originWx.gust + ' km/h');
    if (weatherCache && !weatherCache.live) details.push('📴 数据源：离线估算');
    $('detailRow').innerHTML = details.map(x => '<span>' + x + '</span>').join('');

    const card = $('resultCard');
    card.classList.add('updating');
    setTimeout(() => card.classList.remove('updating'), 400);
  }

  /* ---------- 17. 主因分析 ---------- */
  function renderFactors(r, sel) {
    const items = [];
    if (r.originImpact.reasons.length) {
      r.originImpact.reasons.slice(0, 2).forEach(x => {
        items.push({ label: '出发天气 · ' + x.text, weight: x.weight * 0.50 });
      });
    }
    if (r.destImpact.reasons.length) {
      r.destImpact.reasons.slice(0, 1).forEach(x => {
        items.push({ label: '到达天气 · ' + x.text, weight: x.weight * 0.25 });
      });
    }
    if (r.upstream > 0.05) {
      items.push({ label: '上游航班延误传导', weight: r.upstream * 0.35 });
    }
    if (r.hourDelay > 0.14) {
      items.push({ label: '傍晚/午后延误累积', weight: r.hourDelay * 0.40 });
    } else if (r.hourDelay < 0.10) {
      items.push({ label: '早班时段（准点率最高）', weight: -(0.12 - r.hourDelay) * 0.5 });
    }
    if (r.congestion > 0.5) {
      items.push({ label: '出发机场空域拥堵', weight: r.congestion * 0.28 });
    }
    if (r.airlineBase > 0.06) {
      items.push({ label: '航司历史延误偏高（' + AIRLINES[sel.airline].name + '）', weight: (r.airlineBase - 0.055) * 0.45 });
    } else if (r.airlineBase < 0.05) {
      items.push({ label: '航司准点表现优秀（' + AIRLINES[sel.airline].name + '）', weight: -(0.055 - r.airlineBase) * 0.4 });
    }
    if (r.seasonal > 0.05) {
      items.push({ label: '季节因素（雷暴/冰雪高发期）', weight: r.seasonal * 0.45 });
    }

    items.sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight));
    const top = items.slice(0, 4);

    if (!top.length) {
      $('factorsList').innerHTML = '<div class="factor-empty">各项条件良好，无明显风险因子</div>';
      return;
    }

    const maxW = Math.max(...top.map(x => Math.abs(x.weight)));
    $('factorsList').innerHTML = top.map(x => {
      const pct = Math.round(Math.abs(x.weight) / maxW * 100);
      const positive = x.weight > 0;
      const color = positive ? '#d4751a' : '#2f9e6c';
      const sign = positive ? '+' : '−';
      return `
        <div class="factor-item">
          <span style="min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${x.label}</span>
          <div class="factor-bar-bg">
            <div class="factor-bar-fill" style="width:${pct}%;background:${color};"></div>
          </div>
          <span class="factor-pct" style="color:${color};">${sign}${pct}%</span>
        </div>`;
    }).join('');
  }

  /* ---------- 18. 初始化 ---------- */
  function initSelects() {
    const originSel = $('originSelect');
    const destSel = $('destSelect');
    const codes = Object.keys(AIRPORTS);
    const opts = codes.map(c =>
      `<option value="${c}">${AIRPORTS[c].city} (${c}) · ${AIRPORTS[c].note}</option>`
    ).join('');
    originSel.innerHTML = opts;
    destSel.innerHTML = opts;
    originSel.value = 'PEK';
    destSel.value = 'CAN';
  }

  function updateHints() {
    const tk = $('timeSelect').value;
    $('timeHint').textContent = TIME_ONTIME_HINT[tk] || '';
    const ak = $('airlineSelect').value;
    $('airlineHint').textContent = '正常率 ' + (AIRLINES[ak].ontine * 100).toFixed(1) + '%';
  }

  function bindEvents() {
    $('predictBtn').addEventListener('click', runPrediction);
    $('refreshBtn').addEventListener('click', () => syncWeather(true));
    ['airlineSelect', 'originSelect', 'destSelect', 'dateSelect', 'timeSelect'].forEach(id => {
      $(id).addEventListener('change', () => {
        updateHints(); renderWeatherStrip(); runPrediction();
      });
    });
  }

  /* ---------- 19. 自动更新 ---------- */
  function setupAutoUpdate() {
    setInterval(() => {
      const todayStr = fmtDate(new Date());
      const cached = loadCache();
      const need = !cached || cached.cachedOn !== todayStr
        || (Date.now() - cached.updatedAt) > CACHE_TTL;
      if (need && !syncing) {
        console.log('[auto] 触发每日/过期自动更新');
        syncWeather(true);
      }
    }, 20 * 60 * 1000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || syncing) return;
      const cached = loadCache();
      const todayStr = fmtDate(new Date());
      if (!cached || cached.cachedOn !== todayStr
        || (Date.now() - cached.updatedAt) > CACHE_TTL) {
        syncWeather(true);
      }
    });

    scheduleMidnightRefresh();
  }

  function scheduleMidnightRefresh() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(24, 1, 0, 0);
    const delay = next - now;
    setTimeout(() => {
      console.log('[auto] 跨天刷新天气数据');
      syncWeather(true);
      scheduleMidnightRefresh();
    }, delay);
  }

  /* ---------- 20. 启动 ---------- */
  function boot() {
    initSelects(); updateHints(); bindEvents();
    setupAutoUpdate(); syncWeather(false);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>
