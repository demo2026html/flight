<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>航班延误预测 - 版本选择</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;}
body{
    font‑family: system‑ui,‑apple‑system,Segoe UI,Roboto,sans‑serif;
    background: linear‑gradient(145deg,#eef4fe 0%,#d6e4f7 100%);
    min‑height:100vh;
    display:flex;
    align‑items:center;
    justify‑content:center;
    padding:1.2rem;
}
.card{
    background:rgba(255,255,255,0.88);
    backdrop‑filter:blur(14px);
    border‑radius:2rem;
    padding:2.5rem 2rem;
    width:100%;
    max‑width:520px;
    box‑shadow:0 22px 45px ‑8px rgba(0,30,60,0.25);
    border:1px solid rgba(255,255,255,0.7);
    text‑align:center;
}
h1{
    font‑size:1.6rem;
    color:#0b2b4b;
    margin‑bottom:0.6rem;
}
.desc{
    color:#2c4a6e;
    font‑size:0.9rem;
    margin‑bottom:2rem;
    line‑height:1.55;
}
.btn‑wrap{
    display:flex;
    flex‑direction:column;
    gap:1rem;
}
a.btn{
    display:block;
    text‑decoration:none;
    padding:1.1rem;
    border‑radius:1.6rem;
    font‑weight:700;
    font‑size:1rem;
    transition:transform 0.2s,box‑shadow 0.2s;
}
a.btn‑cn{
    background:linear‑gradient(135deg,#a00d25,#c8102e);
    color:#ffffff;
    box‑shadow:0 10px 22px ‑8px rgba(200,16,46,0.4);
}
a.btn‑global{
    background:linear‑gradient(135deg,#12406a,#1b4d7a);
    color:#ffffff;
    box‑shadow:0 10px 22px ‑8px rgba(27,77,122,0.4);
}
a.btn:hover{
    transform:translateY(‑3px);
}
.note{
    margin‑top:1.8rem;
    font‑size:0.72rem;
    color:#5a7189;
    line‑height:1.45;
}
@media(max‑width:480px){
    .card{padding:1.8rem 1.2rem;}
    h1{font‑size:1.35rem;}
}
</style>
</head>
<body>
<div class="card">
    <h1>✈️ 航班延误智能预测系统</h1>
    <div class="desc">请选择需要打开的系统版本<br>【国内中文版为主力参赛作品，全球版为拓展原型】</div>
    <div class="btn‑wrap">
        <a href="./index.html" class="btn btn‑cn">🇨🇳 国内中文版（主演示）</a>
        <a href="./global.html" class="btn btn‑global">🌐 Global 全球英文版（拓展原型）</a>
    </div>
    <div class="note">
        说明：国内版数据集参考民航公开统计；全球版部分机场基线为区域经验估算，仅作技术原型演示。
    </div>
</div>
</body>
</html>
